services:
  menu-app:
    build: .
    container_name: menu-app
    restart: unless-stopped
    environment:
      - PORT=4100
      # Time zone for "today" (e.g. past meals aren't added to the shopping list)
      - TZ=${TZ:-Europe/Zurich}
      # Name of the admin created on the very first start (password is printed in the logs)
      # - ADMIN_USERNAME=admin
      # Optional features, set them in a .env file next to this one (e.g. RECIPE_CHECKS=1)
      - RECIPE_CHECKS=${RECIPE_CHECKS:-}
    volumes:
      - ./data:/data
    ports:
      # Only reachable from this machine (for a reverse proxy with HTTPS).
      # To open it on your home network instead, use "4100:4100".
      - "127.0.0.1:4100:4100"
